<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GreenNest</title>

    <style>
        * {
            box-sizing: border-box;
            color: #090909;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .login-section {
            background-image: url("main.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            animation: loginAppear 0.7s ease;
        }

        .login-section h1 {
            margin-bottom: 8px;
            font-size: 34px;
            text-align: center;
            color: white;
        }

        .login-section > p {
            color: white;
            margin-bottom: 25px;
            text-align: center;
        }

        .login-section form {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: 0.3s ease;
        }

        .login-section form:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .login-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-section input[type="email"],
        .login-section input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: 0.3s ease;
        }

        .login-section input:focus {
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.12);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-label {
            display: flex !important;
            align-items: center;
            gap: 6px;
            margin: 0 !important;
            font-weight: normal !important;
        }

        .login-options a,
        .signup-link a {
            text-decoration: none;
            color: #285c36;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #285c36;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .login-btn:hover {
            background: #1e4629;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .signup-link {
            margin-top: 25px;
            text-align: center;
            color: white;
        }

        @keyframes loginAppear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .login-section {
                padding: 30px 15px;
            }

            .login-section form {
                padding: 25px;
            }

            .login-section h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <main>
        <section class="login-section">
            <h1>Welcome Back</h1>
            <p>Login to your GreenNest Account</p>

            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your Email"
                    autocomplete="username"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your Password"
                    autocomplete="current-password"
                    required
                >

                <div class="login-options">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <p class="signup-link">
                Don't Have An Account?
                <a href="signup.html">Sign Up</a>
            </p>
        </section>
    </main>

    <script>
        // ==========================================
        // GREENNEST - LOGIN
        // ==========================================

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("loginEmail")
                .value.trim().toLowerCase();

            const password = document.getElementById("loginPassword")
                .value;

            if (!email || !password) {
                alert("Please enter your email and password.");
                return;
            }

            // ADMIN LOGIN
            // Demo credentials only; this is not secure server-side authentication.
            if (
                email === "devgurll@example.com" &&
                password === "devi07"
            ) {
                const adminUser = {
                    name: "GreenNest Admin",
                    email: email,
                    phone: "Admin",
                    isAdmin: true
                };

                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(adminUser)
                );

                alert("Admin login successful!");
                window.location.href = "user-profile.html";
                return;
            }

            // Get registered accounts
            let users;

            try {
                users = JSON.parse(localStorage.getItem("users")) || [];

                if (!Array.isArray(users)) {
                    alert("Saved account data is invalid. Please check storage.");
                    return;
                }
            } catch (error) {
                alert("Unable to read registered accounts.");
                return;
            }

            // Find registered user
            const user = users.find(function (item) {
                return item.email &&
                    item.email.toLowerCase() === email;
            });

            if (!user) {
                alert("Account not found. Please sign up first.");
                return;
            }

            // Verify password
            if (user.password !== password) {
                alert("Incorrect password. Please try again.");
                return;
            }

            // Save the correct user's active session
            localStorage.setItem(
                "currentUser",
                JSON.stringify(user)
            );

            alert("Login successful! Welcome to GreenNest 🌿");

            // Returning user goes directly to the homepage
            window.location.href = "home.html";
        });

        // Forgot password placeholder
        document.getElementById("forgotPassword")
            .addEventListener("click", function (event) {
                event.preventDefault();
                alert("Password recovery is not set up yet. Please contact support.");
            });
    </script>
</body>
</html>
