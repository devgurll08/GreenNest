<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;
        }

        .orders-section {
            padding: 60px 7%;
            min-height: 100vh;
        }

        .orders-section > h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 40px;
        }

        .orders-container {
            max-width: 1000px;
            margin: auto;

            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .order-card {
            background: white;
            padding: 25px;

            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);

            transition: 0.3s ease;
        }

        .order-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding-bottom: 15px;
            margin-bottom: 15px;

            border-bottom: 1px solid #eee;
        }

        .order-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .order-status {
            padding: 7px 12px;

            border-radius: 20px;

            font-size: 14px;
            font-weight: 600;
        }

        .order-info {
            display: flex;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;
        }

        .order-info p {
            margin: 5px 0;
        }

        .order-items {
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;

            padding: 8px 0;
        }

        .order-total {
            display: flex;
            justify-content: space-between;

            margin-top: 20px;
            padding-top: 15px;

            border-top: 1px solid #eee;

            font-size: 19px;
            font-weight: bold;
        }

        .payment-method {
            margin-top: 12px;

            font-size: 14px;
        }

        .empty-orders {
            background: white;

            max-width: 600px;

            margin: 50px auto;

            padding: 40px;

            text-align: center;

            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .empty-orders h2 {
            margin-bottom: 10px;
        }

        @media (max-width: 650px) {

            .orders-section {
                padding: 45px 20px;
            }

            .orders-section > h1 {
                font-size: 30px;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;

                gap: 10px;
            }

            .order-info {
                flex-direction: column;
                gap: 5px;
            }

            .order-item {
                gap: 15px;
            }

        }

    </style>

</head>

<body>

    <main>

        <section class="orders-section">

            <h1>My Orders 📦</h1>

            <div class="orders-container" id="ordersContainer">
            </div>

        </section>

    </main>


    <script>

        // Get logged-in user
        const currentUser =
            JSON.parse(localStorage.getItem("currentUser"));


        // Login check
        if (!currentUser) {

            alert("Please login first.");

            window.location.href = "login.html";
        }


        const ordersContainer =
            document.getElementById("ordersContainer");


        // Get all orders
        const orders =
            JSON.parse(localStorage.getItem("orders")) || [];


        // Get only current user's orders
        const userOrders =
            orders.filter(function (order) {

                return order.userEmail === currentUser.email;

            });


        // Display orders
        function displayOrders() {

            ordersContainer.innerHTML = "";


            // No orders
            if (userOrders.length === 0) {

                ordersContainer.innerHTML = `
                    <div class="empty-orders">

                        <h2>No Orders Yet 📦</h2>

                        <p>
                            You haven't placed any orders yet.
                        </p>

                    </div>
                `;

                return;
            }


            // Display each order
            userOrders.reverse().forEach(function (order) {

                const orderCard =
                    document.createElement("div");

                orderCard.classList.add("order-card");


                // Format date
                const orderDate =
                    new Date(order.date);

                const formattedDate =
                    orderDate.toLocaleDateString("en-IN", {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    });


                // Payment name
                let paymentText =
                    order.paymentMethod;

                if (order.paymentMethod === "cod") {

                    paymentText =
                        "Cash on Delivery";

                } else if (order.paymentMethod === "online") {

                    paymentText =
                        "Online Payment";
                }


                // Order items
                let itemsHTML = "";


                order.items.forEach(function (item) {

                    itemsHTML += `
                        <div class="order-item">

                            <span>
                                ${item.name} × ${item.quantity}
                            </span>

                            <span>
                                ₹${item.price * item.quantity}
                            </span>

                        </div>
                    `;

                });


                // Order card
                orderCard.innerHTML = `

                    <div class="order-header">

                        <h2>
                            Order #${order.id}
                        </h2>

                        <span class="order-status">
                            ${order.status}
                        </span>

                    </div>


                    <div class="order-info">

                        <div>

                            <p>
                                <strong>Date:</strong>
                                ${formattedDate}
                            </p>

                            <p>
                                <strong>Customer:</strong>
                                ${order.customer.name}
                            </p>

                        </div>


                        <div>

                            <p>
                                <strong>City:</strong>
                                ${order.customer.city}
                            </p>

                            <p>
                                <strong>Payment:</strong>
                                ${paymentText}
                            </p>

                        </div>

                    </div>


                    <div class="order-items">

                        ${itemsHTML}

                    </div>


                    <div class="order-total">

                        <span>Total</span>

                        <span>
                            ₹${order.total}
                        </span>

                    </div>

                `;


                ordersContainer.appendChild(orderCard);

            });

        }


        displayOrders();

    </script>

</body>

</html>
